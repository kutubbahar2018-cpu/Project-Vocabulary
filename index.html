function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function sshuf(a){a=[...a].sort((x,y)=>x.w.toLowerCase()<y.w.toLowerCase()?-1:1);let t=20261006;const r=()=>{t+=0x6D2B79F5;let x=Math.imul(t^t>>>15,t|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

if(t==='bn'){if(!w.b)return null;q=`Which word matches the meaning “${w.b}”?`;opts=[w.w,...o.slice(0,3).map(z=>z.w)];x=`“${w.w}” means ${w.d}.`;c=w.w}
else if(t==='mean'){q=`Which word best fits this definition?\n“${w.d}”`;opts=[w.w,...o.slice(0,3).map(z=>z.w)];x=`“${w.w}” means ${w.d}.`;c=w.w}
else if(t==='comp'){const b=blank(w.e,w.w);if(!b)return null;q='Choose the word that best completes the sentence:\n'+b;opts=[w.w,...o.slice(0,3).map(z=>z.w)];x=`${w.e} (“${w.w}”: ${w.d}.)`;c=w.w}

return`<h1>${r.day?'Day '+r.day+' ':''}Quiz Complete</h1><div class="hero2" style="flex-direction:column;justify-content:center;text-align:center"><div class="big" style="font-size:3rem">${r.c} / ${r.n}</div><div class="big">${r.pct}%</div>${bar(r.pct)}<p>Correct ${r.c} · Incorrect ${w} · Unanswered ${r.u} · Accuracy ${r.pct}%</p></div><div class="card"><p>${comment(r.pct)}</p></div><div class="row">${r.day?`<a class="b pri" href="#/day/${r.day}">Back to Day ${r.day}</a>`:''}<a class="b ${r.day?'':'pri'}" href="#/quiz">More quizzes</a><a class="b" href="#/review">Review Center</a></div><h2>Review Answers</h2>${r.qs.map((q,i)=>{const u=q.sel<0,ok=q.sel===q.c;return`<div class="card" style="margin:.7rem 0"><b>Question ${i+1}</b> <span class="badge">${u?'Unanswered':ok?'Correct ✓':'Incorrect ✗'}</span><p style="white-space:pre-line">${e(q.q)}</p><p>Your answer: ${u?'—':'ABCD'[q.sel]+'. '+e(q.o[q.sel])}</p><p>Correct: ${'ABCD'[q.c]}. ${e(q.o[q.c])} ✓</p><p class="mu">${e(q.x)}</p></div>`}).join('')}`};
P.progress=()=>{if(!CRS())return none();const s=stats(),st=streaks(),dc=CRS().days.filter((_,i)=>status(i+1)==='completed').length,pct=s.T?Math.round(s.L/s.T*100):0,acc=ATT().length?Math.round(ATT().reduce((a,b)=>a+b.pct,0)/ATT().length):null;
const ty={};ATT().forEach(a=>{for(const t in a.r){ty[t]=ty[t]||[0,0];ty[t][0]+=a.r[t][0];ty[t][1]+=a.r[t][1]}});const ar=Object.entries(ty).map(([t,[c,n]])=>[t,Math.round(c/n*100)]).sort((a,b)=>b[1]-a[1]);
const tl=CRS().days.map((ids,i)=>[i+1,ids,status(i+1)]).filter(([,,t])=>t==='completed'||t==='in-progress').slice(-8).reverse().map(([n,ids,t])=>{const b=ATT().filter(a=>a.day===n).map(a=>a.pct);return`<div class="tl"><span class="td"></span><b>Day ${n}</b> <span class="badge">${t==='completed'?'Completed':'In progress'}</span><p class="mu">${ids.filter(z=>S.p.k[z]).length} / ${ids.length} words${b.length?' · best quiz '+Math.max(...b)+'%':''}</p></div>`}).join('');const cal=Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);const k=d.toISOString().slice(0,10);return`<span title="${k}" aria-label="${k}: ${S.days.includes(k)?'studied':'no study'}" style="width:18px;height:18px;border-radius:5px;background:${S.days.includes(k)?'var(--ok)':'var(--bd)'}"></span>`}).join('');
return`<h1>${e(SECDEF[CUR].name)} Progress</h1><div class="card"><b>Course progress ${pct}%</b>${bar(pct)}${dc===CRS().days.length?'<h2>Vocabulary Course Complete!</h2>':''}</div><div class="grid" style="margin-top:1rem">${[['Words learned',s.L+' / '+s.T],['Days completed',dc+' / '+CRS().days.length],['Quiz average',s.q==null?'—':s.q+'%'],['Best quiz',s.best==null?'—':s.best+'%'],['Needing review',s.H],['Favorites',s.fav],['Current streak',st.cur],['Longest streak',st.best],['Quiz attempts',ATT().length],['Avg accuracy',acc==null?'—':acc+'%']].map(([a,b])=>`<div class="card"><small class="mu">${a}</small><div class="big">${b}</div></div>`).join('')}</div>
<div class="card" style="margin-top:1rem"><h3>Last 14 days</h3><div class="row" style="gap:4px">${cal}</div><p class="mu">Missing a day is fine. Just pick up again.</p></div>
<div class="card" style="margin-top:1rem"><h3>Learning timeline</h3>${tl||'<p class="mu">Your first day starts here.</p>'}</div>
<div class="card" style="margin-top:1rem"><h3>Skill system</h3>${ar.map(([t,p])=>`<div style="margin:.5rem 0"><div class="row" style="margin:0"><span>${TL[t]}</span><span class="mu" style="flex:0">${p}%</span></div>${bar(p)}</div>`).join('')}${ATT().length>2&&ar.length>1?`<p>Strongest: ${TL[ar[0][0]]} — ${ar[0][1]}%</p><p>Weakest: ${TL[ar.at(-1)[0]]} — ${ar.at(-1)[1]}%</p><button data-a="weak">Practice Weak Areas</button>`:'<p class="mu">Take a few quizzes and we\'ll show where to focus.</p>'}</div>`};
P.settings=()=>`<h1>Settings</h1><div class="card"><h3>Appearance</h3><select id="st" aria-label="Theme">${['system','light','dark'].map(t=>`<option ${S.set.theme===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="card" style="margin-top:1rem"><h3>Learning</h3><p>Words per day: 10</p><h3>Quiz</h3><select id="sm" aria-label="Default mode">${['practice','exam'].map(t=>`<option ${S.set.mode===t?'selected':''}>${t}</option>`).join('')}</select><p class="mu">Reminders: coming later.</p></div><div class="card" style="margin-top:1rem"><h3>Course management</h3><div class="row"><button data-a="reset">Reset Progress</button></div><p class="mu">Your progress is saved in this browser.</p></div>`;
P.contact=()=>`<h1>Meet me</h1><div class="me"><img class="mep" src="${PHOTO}" alt="Md Kutub Uddin Bahar" width="560" height="432"><div class="met"><h2 style="font-size:1.6rem;margin:0">Md Kutub Uddin Bahar</h2><p class="mu" style="margin:.2rem 0 .8rem">Aspiring Business Analyst &middot; BBA, University of Dhaka</p><p>Hi, I'm Kutub. I teach English and study Banking &amp; Insurance at the University of Dhaka. After years of helping students build their vocabulary in the classroom, I made Project Vocabulary to give any learner the same simple routine: ten words a day, a quiz to check them, and progress you can see.</p><div class="row"><a class="b pri" href="${SITE}" target="_blank" rel="noopener">Visit my website</a></div></div></div><h2>About me</h2><div class="grid g2"><div class="card"><small class="mu">Teaching</small><p style="margin:.2rem 0 0">English Instructor at 10 Minute School English Centre. English Instructor and Head of Department (English) at ExcelBiz. 3+ years of teaching and mentoring.</p></div><div class="card"><small class="mu">Writing</small><p style="margin:.2rem 0 0">Academic content contributor for HSC practice books.</p></div><div class="card"><small class="mu">Studying</small><p style="margin:.2rem 0 0">BBA in Banking &amp; Insurance, University of Dhaka (third year).</p></div><div class="card"><small class="mu">Skills</small><p style="margin:.2rem 0 0">Business analysis, SQL and data, financial record-keeping, communication.</p></div></div><h2 style="margin-top:1.6rem">Get in touch</h2><div class="grid g2">${[['mail','Email','kutubbahar2018@gmail.com','mailto:kutubbahar2018@gmail.com'],['phone','Phone','+880 1522-133848','tel:+8801522133848'],['insta','Instagram','@the_pixel_booth',''],['link','Facebook','Md Kutub Uddin Bahar','https://www.facebook.com/share/14x6mxEVLKC/'],['globe','Website','kutubbahar2018-cpu.github.io',SITE]].map(([k,a,b,h])=>h?`<a class="card ct" href="${h}" ${h.startsWith('http')?'target="_blank" rel="noopener"':''}><span class="si">${ic(k,20)}</span><small class="mu">${a}</small><b>${b}</b></a>`:`<div class="card ct" style="cursor:default"><span class="si">${ic(k,20)}</span><small class="mu">${a}</small><b>${b}</b></div>`).join('')}</div>`;

function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;requestAnimationFrame(()=>t.classList.add('on'));clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function countUp(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;A.querySelectorAll('.big').forEach(el=>{const m=/^(\d+)(%?)$/.exec(el.textContent.trim());if(!m||el.closest('.day')||(m[1].length>1&&m[1][0]==='0')||+m[1]<2)return;const to=+m[1],suf=m[2],t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=['#7c5cd6','#a58df0','#c9bcf7','#e0b3f5','#8aa4f0'];for(let i=0;i<45;i++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${rnd(100)}vw;background:${c[rnd(5)]};animation-delay:${rnd(600)}ms`;document.body.append(s);setTimeout(()=>s.remove(),3200)}}

know:(t,id)=>mark(id,'known'),more:()=>{VF.n+=60;soft()},all:()=>{VF.n=1e5;soft()},exp:()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify({v:3,p:S.p,a:S.att,d:S.days}))));const t=$('#sc');t.value=c;t.select();toast('Code created. Copy it')},imp:()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#sc').value.trim()))));if(!o.p||!o.p.k)throw 0;S.p=o.p;S.att=o.a||[];S.days=o.d||[];save();toast('Progress restored');route()}catch(_){toast('That code did not work')}},flag:(t,id)=>{if(S.p.k[id]==='hard')delete S.p.k[id];else S.p.k[id]='hard';S.p.t[id]=Date.now();save();soft()},learnall:t=>{const n=+t.dataset.day;CRS().days[n-1].forEach(id=>{if(S.p.k[id]!=='hard')S.p.k[id]='known';S.p.t[id]=Date.now()});touch();save();soft();confetti();toast('Day '+n+' complete')},hard:(t,id)=>mark(id,'hard'),
