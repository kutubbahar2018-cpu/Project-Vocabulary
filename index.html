return`<h1>${r.welcome?'Welcome ':r.day?'Day '+r.day+' ':''}Quiz Complete</h1><div class="hero2" style="flex-direction:column;justify-content:center;text-align:center"><div class="big" style="font-size:3rem">${r.c} / ${r.n}</div><div class="big">${r.pct}%</div>${bar(r.pct)}<p>Correct ${r.c} · Incorrect ${w} · Unanswered ${r.u} · Accuracy ${r.pct}%</p></div><div class="card"><p>${comment(r.pct)}</p></div><div class="row">${r.welcome?'<button class="pri" data-a="wdone">Go to dashboard</button>':''}${r.day?`<a class="b pri" href="#/day/${r.day}">Back to Day ${r.day}</a>`:''}<a class="b ${r.day||r.welcome?'':'pri'}" href="#/quiz">More quizzes</a><a class="b" href="#/review">Review Center</a></div><h2>Review Answers</h2>${r.qs.map((q,i)=>{const u=q.sel<0,ok=q.sel===q.c;return`<div class="card" style="margin:.7rem 0"><b>Question ${i+1}</b> <span class="badge">${u?'Unanswered':ok?'Correct ✓':'Incorrect ✗'}</span><p style="white-space:pre-line">${e(q.q)}</p><p>Your answer: ${u?'—':'ABCD'[q.sel]+'. '+e(q.o[q.sel])}</p><p>Correct: ${'ABCD'[q.c]}. ${e(q.o[q.c])} ✓</p><p class="mu">${e(q.x)}</p></div>`}).join('')}`};
P.progress=()=>{if(!CRS())return none();const s=stats(),st=streaks(),dc=CRS().days.filter((_,i)=>status(i+1)==='completed').length,pct=s.T?Math.round(s.L/s.T*100):0,acc=ATT().length?Math.round(ATT().reduce((a,b)=>a+b.pct,0)/ATT().length):null;
const ty={};ATT().forEach(a=>{for(const t in a.r){ty[t]=ty[t]||[0,0];ty[t][0]+=a.r[t][0];ty[t][1]+=a.r[t][1]}});const ar=Object.entries(ty).map(([t,[c,n]])=>[t,Math.round(c/n*100)]).sort((a,b)=>b[1]-a[1]);
const tl=CRS().days.map((ids,i)=>[i+1,ids,status(i+1)]).filter(([,,t])=>t==='completed'||t==='in-progress').slice(-8).reverse().map(([n,ids,t])=>{const b=ATT().filter(a=>a.day===n).map(a=>a.pct);return`<div class="tl"><span class="td"></span><b>Day ${n}</b> <span class="badge">${t==='completed'?'Completed':'In progress'}</span><p class="mu">${ids.filter(z=>S.p.k[z]).length} / ${ids.length} ${NW()}${b.length?' · best quiz '+Math.max(...b)+'%':''}</p></div>`}).join('');const cal=Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);const k=d.toISOString().slice(0,10);return`<span title="${k}" aria-label="${k}: ${S.days.includes(k)?'studied':'no study'}" style="width:18px;height:18px;border-radius:5px;background:${S.days.includes(k)?'var(--ok)':'var(--bd)'}"></span>`}).join('');
return`<h1>${e(SECDEF[CUR].name)} Progress</h1><div class="card"><b>Course progress ${pct}%</b>${bar(pct)}${dc===CRS().days.length?'<h2>Vocabulary Course Complete!</h2>':''}</div><div class="grid" style="margin-top:1rem">${[[CAP(NW())+' learned',s.L+' / '+s.T],['Days completed',dc+' / '+CRS().days.length],['Quiz average',s.q==null?'—':s.q+'%'],['Best quiz',s.best==null?'—':s.best+'%'],['Needing review',s.H],['Favorites',s.fav],['Current streak',st.cur],['Longest streak',st.best],['Quiz attempts',ATT().length],['Avg accuracy',acc==null?'—':acc+'%']].map(([a,b])=>`<div class="card"><small class="mu">${a}</small><div class="big">${b}</div></div>`).join('')}</div>
<div class="card" style="margin-top:1rem"><h3>Last 14 days</h3><div class="row" style="gap:4px">${cal}</div><p class="mu">Missing a day is fine. Just pick up again.</p></div>
<div class="card" style="margin-top:1rem"><h3>Learning timeline</h3>${tl||'<p class="mu">Your first day starts here.</p>'}</div>
<div class="card" style="margin-top:1rem"><h3>Skill system</h3>${ar.map(([t,p])=>`<div style="margin:.5rem 0"><div class="row" style="margin:0"><span>${TL[t]}</span><span class="mu" style="flex:0">${p}%</span></div>${bar(p)}</div>`).join('')}${ATT().length>2&&ar.length>1?`<p>Strongest: ${TL[ar[0][0]]} — ${ar[0][1]}%</p><p>Weakest: ${TL[ar.at(-1)[0]]} — ${ar.at(-1)[1]}%</p><button data-a="weak">Practice Weak Areas</button>`:'<p class="mu">Take a few quizzes and we\'ll show where to focus.</p>'}</div>`};
P.settings=()=>`<h1>Settings</h1><div class="card"><h3>Appearance</h3><select id="st" aria-label="Theme">${['system','light','dark'].map(t=>`<option ${S.set.theme===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="card" style="margin-top:1rem"><h3>Learning</h3><p>Words per day: set by each section</p><h3>Quiz</h3><select id="sm" aria-label="Default mode">${['practice','exam'].map(t=>`<option ${S.set.mode===t?'selected':''}>${t}</option>`).join('')}</select><p class="mu">Reminders: coming later.</p></div><div class="card" style="margin-top:1rem"><h3>Course management</h3><div class="row"><button data-a="reset">Reset Progress</button></div><p class="mu">Your progress is saved in this browser.</p></div>`;
P.contact=()=>`<h1>Meet me</h1><div class="me"><img class="mep" src="${PHOTO}" alt="Md Kutub Uddin Bahar" width="560" height="432"><div class="met"><h2 style="font-size:1.6rem;margin:0">Md Kutub Uddin Bahar</h2><p class="mu" style="margin:.2rem 0 .8rem">Aspiring Business Analyst &middot; BBA, University of Dhaka</p><p>Hi, I'm Kutub. I teach English and study Banking &amp; Insurance at the University of Dhaka. After years of helping students build their vocabulary in the classroom, I made Project Vocabulary to give any learner the same simple routine: ten words a day, a quiz to check them, and progress you can see.</p><div class="row"><a class="b pri" href="${SITE}" target="_blank" rel="noopener">Visit my website</a></div></div></div><h2>About me</h2><div class="grid g2"><div class="card"><small class="mu">Teaching</small><p style="margin:.2rem 0 0">English Instructor at 10 Minute School English Centre. English Instructor and Head of Department (English) at ExcelBiz. 3+ years of teaching and mentoring.</p></div><div class="card"><small class="mu">Writing</small><p style="margin:.2rem 0 0">Academic content contributor for HSC practice books.</p></div><div class="card"><small class="mu">Studying</small><p style="margin:.2rem 0 0">BBA in Banking &amp; Insurance, University of Dhaka (third year).</p></div><div class="card"><small class="mu">Skills</small><p style="margin:.2rem 0 0">Business analysis, SQL and data, financial record-keeping, communication.</p></div></div><h2 style="margin-top:1.6rem">Get in touch</h2><div class="grid g2">${[['mail','Email','kutubbahar2018@gmail.com','mailto:kutubbahar2018@gmail.com'],['phone','Phone','+880 1522-133848','tel:+8801522133848'],['insta','Instagram','@the_pixel_booth',''],['link','Facebook','Md Kutub Uddin Bahar','https://www.facebook.com/share/14x6mxEVLKC/'],['globe','Website','kutubbahar2018-cpu.github.io',SITE]].map(([k,a,b,h])=>h?`<a class="card ct" href="${h}" ${h.startsWith('http')?'target="_blank" rel="noopener"':''}><span class="si">${ic(k,20)}</span><small class="mu">${a}</small><b>${b}</b></a>`:`<div class="card ct" style="cursor:default"><span class="si">${ic(k,20)}</span><small class="mu">${a}</small><b>${b}</b></div>`).join('')}</div>`;
let LG=0;const logo=(s=36)=>{const id='lg'+(++LG);return`<svg width="${s}" height="${s}" viewBox="0 0 48 48" role="img" aria-label="Project Vocabulary logo" style="flex:none;display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9677e8"/><stop offset="1" stop-color="#5b3fb8"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#${id})"/><path d="M13.5 15L24 34.5" fill="none" stroke="#fff" stroke-width="5.6" stroke-linecap="round"/><path d="M34.5 15L24 34.5" fill="none" stroke="#d9ccfa" stroke-width="5.6" stroke-linecap="round"/><path d="M36.5 7v7M33 10.5h7" fill="none" stroke="#efe9fc" stroke-width="2.2" stroke-linecap="round"/></svg>`};
