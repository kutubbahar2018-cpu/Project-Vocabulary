function rnext(st,g){const o={ef:st?st.ef:2.5,iv:st?st.iv:0,reps:st?st.reps:0,lapses:st?st.lapses:0};
if(g===0){o.lapses++;o.reps=0;o.iv=0;o.ef=Math.max(1.3,o.ef-.2)}
else if(g===1){o.iv=Math.max(1,Math.round(Math.max(o.iv,1)*1.2));o.ef=Math.max(1.3,o.ef-.15);o.reps++}
else if(g===2){o.iv=o.reps===0?2:o.reps===1?4:Math.round(o.iv*o.ef);o.iv=Math.max(o.iv,rnext(st,1).iv+1);o.reps++}
else{const gi=rnext(st,2).iv;o.iv=Math.max(o.reps===0?4:Math.round(Math.max(o.iv,1)*o.ef*1.3),gi+1);o.ef+=.15;o.reps++}

const view=()=>{try{const h=(location.hash||'#/dashboard').slice(1),pg=h.split('/')[1]||'dashboard';const p=!S||!S.user?'/login':(SP.includes(pg)?'/'+CUR+h:h);if(p===last)return;last=p;gc({path:p,title:p})}catch(_){}};
sc.onload=view;document.head.appendChild(sc);
addEventListener('hashchange',()=>{setTimeout(view,30);try{if(location.hash==='#/result'&&S.last){const q=S.last.pct;ev('quiz-finished/'+CUR+'/'+(q>=90?'90-100':q>=70?'70-89':q>=50?'50-69':'0-49'))}}catch(_){}});
document.addEventListener('click',e=>{try{const t=e.target.closest('[data-a]');if(t){const a=t.dataset.a,d=t.dataset.day;if(a==='learnall')ev('level-complete/'+CUR+'/'+d);else if(a==='startq')ev('quiz-start/'+CUR+(d?'/'+d:''));else if(a==='mega')ev((t.dataset.k==='final'?'final':'mega')+'-start/'+CUR)}if(e.target.closest('#langbtn'))setTimeout(()=>ev('language/'+document.documentElement.lang),60)}catch(_){}},true);
addEventListener('appinstalled',()=>ev('app-installed'));
})();
</script>
</body></html>
